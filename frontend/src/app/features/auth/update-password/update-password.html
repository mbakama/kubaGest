<main class="activation-page">
  <section class="activation-card" aria-labelledby="activation-title">
    <div class="activation-icon" aria-hidden="true"><i class="fa-solid fa-user-check"></i></div>
    @if (success()) {
      <h1 id="activation-title">Votre compte est activé</h1>
      <p>Votre mot de passe a été enregistré. Vous pouvez maintenant vous connecter à KubaGest.</p>
      <a routerLink="/authentification" class="activation-primary">Se connecter</a>
    } @else {
      <h1 id="activation-title">Activez votre compte</h1>
      <p>Choisissez un mot de passe personnel pour accepter l’invitation.</p>
      @if (error()) {
        <div class="activation-error" role="alert">{{ error() }}</div>
      }
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          <span>Mot de passe</span>
          <span class="activation-password">
            <input
              pInputText
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="8 caractères minimum"
            />
            <button
              type="button"
              [attr.aria-label]="
                showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
              "
              (click)="showPassword.set(!showPassword())"
            >
              <i
                class="fa-solid"
                [class.fa-eye]="!showPassword()"
                [class.fa-eye-slash]="showPassword()"
                aria-hidden="true"
              ></i>
            </button>
          </span>
          @if (controlError('password')) {
            <small role="alert">{{ controlError('password') }}</small>
          }
        </label>
        <label>
          <span>Confirmer le mot de passe</span>
          <span class="activation-password">
            <input
              pInputText
              [type]="showConfirmation() ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Répéter le mot de passe"
            />
            <button
              type="button"
              [attr.aria-label]="
                showConfirmation() ? 'Masquer la confirmation' : 'Afficher la confirmation'
              "
              (click)="showConfirmation.set(!showConfirmation())"
            >
              <i
                class="fa-solid"
                [class.fa-eye]="!showConfirmation()"
                [class.fa-eye-slash]="showConfirmation()"
                aria-hidden="true"
              ></i>
            </button>
          </span>
          @if (controlError('confirmPassword')) {
            <small role="alert">{{ controlError('confirmPassword') }}</small>
          }
        </label>
        <button class="activation-primary" type="submit" [disabled]="submitting() || !token">
          {{ submitting() ? 'Activation…' : 'Activer mon compte' }}
        </button>
      </form>
    }
  </section>
</main>
