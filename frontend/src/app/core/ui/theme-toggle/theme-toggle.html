<div
  class="flex items-center gap-1 rounded-full border border-outline-variant/40 bg-surface-container-low p-1 shadow-inner dark:border-white/10 dark:bg-[#051424]"
  title="Basculer le thème"
  role="group"
  aria-label="Thème de l’interface"
>
  <button
    type="button"
    class="flex cursor-pointer items-center justify-center gap-1 rounded-full transition-colors"
    [class]="
      theme.dark()
        ? 'p-1.5 text-text-muted hover:text-text-primary'
        : 'border border-primary/40 bg-primary/20 px-2 py-1 text-primary shadow-[0_0_8px] shadow-primary/35'
    "
    [attr.aria-pressed]="!theme.dark()"
    aria-label="Mode jour"
    (click)="setLight()"
  >
    <i class="fa-solid fa-sun text-[16px]" aria-hidden="true"></i>
    @if (!theme.dark()) {
      <span class="text-[11px] font-medium leading-none">Jour</span>
    }
  </button>
  <button
    type="button"
    class="flex cursor-pointer items-center justify-center gap-1 rounded-full transition-all"
    [class]="
      theme.dark()
        ? 'border border-primary/40 bg-primary/20 px-2 py-1 text-primary shadow-[0_0_8px] shadow-primary/35'
        : 'p-1.5 text-text-muted hover:text-text-primary'
    "
    [attr.aria-pressed]="theme.dark()"
    aria-label="Mode nuit"
    (click)="setDark()"
  >
    <i class="fa-solid fa-moon text-[16px]" aria-hidden="true"></i>
    @if (theme.dark()) {
      <span class="text-[11px] font-medium leading-none">Nuit</span>
    }
  </button>
</div>
