    .journal-link{height:44px;padding:0 14px;border:0;border-radius:16px;background:rgba(255,255,255,.88);color:#111;font-size:13px;font-weight:700}
    .counter-lead{margin:-8px 0 14px;color:#3d4240;font-size:14px;line-height:1.4}
    .cart-list{display:grid;gap:8px;margin-bottom:16px}

    .qty{display:flex;align-items:center;gap:8px;margin-top:8px}

    .credit-note{margin:6px 0 10px;font-size:12px;color:#3d4240}

    .tender[hidden],.tender-input[hidden],.credit-panel[hidden]{display:none}

    .tender-input input{height:48px;border:1px solid rgba(17,18,20,.12);border-radius:14px;padding:0 12px;font:inherit;font-size:20px;font-weight:700}
    .tender.change strong{color:#007a55}

    .settings-profile small{display:block;margin-top:3px;color:var(--muted);font-size:12px}
    .settings-group{margin:0 0 14px}

    .settings-card{overflow:hidden;border-radius:22px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.96)}
    .settings-row{width:100%;min-height:56px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;border:0;border-bottom:1px solid rgba(17,18,20,.06);background:transparent;color:inherit;text-align:left}

    .settings-copy small{display:block;margin-top:2px;color:var(--muted);font-size:12px}
    .settings-value{color:#3d4240;font-size:13px;font-weight:600}
    .chevron{width:16px;height:16px;color:#9aa09b}

    .switch span{position:absolute;inset:0;border-radius:99px;background:#d7ddd8;pointer-events:none}
    .switch span:before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s ease}
    .switch input:checked+span{background:#007a55}
    .switch input:checked+span:before{transform:translateX(18px)}

    .notify-title{margin:0;font-size:28px;letter-spacing:-.04em}

    .sale-price small.expiry{color:#9a2b27}

  </div>
  <script>
    const track=document.querySelector('.welcome-track');
    const actions=['Commencer','Continuer','Continuer'];
    let slide=0;
    let drag=null;
    let auto=null;
    function arm(){
      clearTimeout(auto);
      auto=setTimeout(()=>goTo((slide+1)%actions.length),5000);
    }
    function sync(index){
      slide=index;
      document.querySelector('[data-next]').textContent=actions[slide]+' →';
      document.querySelectorAll('.dots button').forEach((dot,index)=>{
        if(index===slide) dot.setAttribute('aria-current','true');
        else dot.removeAttribute('aria-current');
      });
    }
    function goTo(index){
      const next=Math.max(0,Math.min(actions.length-1,index));
      track.scrollTo({left:next*track.clientWidth,behavior:'smooth'});
      sync(next);
      if(!drag) arm();
    }
    track.addEventListener('scroll',()=>{
      if(drag) return;
      const index=Math.round(track.scrollLeft/Math.max(track.clientWidth,1));
      if(index!==slide) sync(index);
    },{passive:true});
    track.addEventListener('pointerdown',(event)=>{
      if(event.button!==0) return;
      clearTimeout(auto);
      drag={id:event.pointerId,x:event.clientX,left:track.scrollLeft};
      track.classList.add('is-dragging');
      track.setPointerCapture(event.pointerId);
    });
    track.addEventListener('pointermove',(event)=>{
      if(!drag||event.pointerId!==drag.id) return;
      track.scrollLeft=drag.left-(event.clientX-drag.x);
    });
    function endDrag(event){
      if(!drag||event.pointerId!==drag.id) return;
      drag=null;
      track.classList.remove('is-dragging');
      goTo(Math.round(track.scrollLeft/Math.max(track.clientWidth,1)));
    }
    track.addEventListener('pointerup',endDrag);
    track.addEventListener('pointercancel',endDrag);
    const app=document.querySelector('.app-phone');
    function showPage(target){
      app.querySelectorAll('.page').forEach(page=>page.hidden=page.dataset.page!==target);
      const current=app.querySelector(`[data-page="${target}"]`);
      if(current) current.scrollTop=0;
      app.querySelectorAll('.nav').forEach(item=>item.classList.toggle('active',item.dataset.target===target));
    }
    document.querySelector('[data-next]').addEventListener('click',()=>{
      if(slide<actions.length-1) goTo(slide+1);
    });
    document.querySelectorAll('.dots button').forEach((dot,index)=>dot.addEventListener('click',()=>goTo(index)));
    arm();
    app.querySelectorAll('.nav').forEach(button=>button.addEventListener('click',()=>{
      const target=button.dataset.target;
      if(target) showPage(target);
      app.querySelectorAll('.nav').forEach(item=>item.classList.remove('active'));
      button.classList.add('active');
    }));
    document.querySelectorAll('.sales-page').forEach(page=>{
      const input=page.querySelector('.received');
      const out=page.querySelector('.change-value');
      const label=page.querySelector('.change-label');
      if(!input||!out||!label) return;
      const render=()=>{
        const digits=input.value.replace(/\D/g,'');
        if(!digits){label.textContent='À rendre';out.textContent='—';return;}
        const diff=Number(digits)-11000;
        const grouped=Math.abs(diff).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
        label.textContent=diff<0?'Il manque':'À rendre';
        out.textContent=grouped+' FC';
      };
      input.addEventListener('input',render);

      // Moyen de paiement : espèces, mobile money ou crédit client.
      const chips=[...page.querySelectorAll('.pay-chip')];
      const tender=page.querySelector('.tender-input');
      const change=page.querySelector('.tender.change');
      const credit=page.querySelector('.credit-panel');
      const renderMethod=(name)=>{
        chips.forEach(chip=>chip.classList.toggle('active',chip.textContent.trim()===name));
        if(tender) tender.hidden=name!=='Espèces';
        if(change) change.hidden=name!=='Espèces';
        if(credit) credit.hidden=name!=='Crédit client';
      };
      chips.forEach(chip=>chip.addEventListener('click',()=>renderMethod(chip.textContent.trim())));
      const changeCustomer=page.querySelector('.credit-change');
      if(changeCustomer){
        const people=[
          {initials:'MK',name:'Marie Kabongo',phone:'+243 810 000 001',due:15000,limit:50000},
          {initials:'JT',name:'Joseph Tshibanda',phone:'+243 820 000 002',due:32000,limit:40000},
        ];
        let index=0;
        changeCustomer.addEventListener('click',()=>{
          index=(index+1)%people.length;
          const person=people[index];
          const card=page.querySelector('.credit-client');
          card.querySelector('.sale-logo').textContent=person.initials;
          card.querySelector('strong').textContent=person.name;
          card.querySelector('small').textContent=person.phone;
          page.querySelector('.credit-note').textContent=
            `Déjà dû ${person.due.toLocaleString('fr-FR').replace(/\u202f/g,' ')} FC · disponible ${(person.limit-person.due).toLocaleString('fr-FR').replace(/\u202f/g,' ')} FC`;
          page.querySelector('.credit-after').textContent=
            `Après cette vente, ${person.name.split(' ')[0]} devra ${(person.due+11000).toLocaleString('fr-FR').replace(/\u202f/g,' ')} FC.`;
        });
      }
    });
    document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.open)));
    document.querySelectorAll('[data-back]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.back)));
    // La photo de profil se choisit depuis l'appareil : la maquette montre
    // l'aperçu rond et le badge de modification, comme l'application.
    document.querySelectorAll('.photo-pick').forEach(button=>{
      const input=document.createElement('input');
      input.type='file';
      input.accept='image/*';
      input.hidden=true;
      button.insertAdjacentElement('afterend',input);
      button.addEventListener('click',()=>input.click());
      input.addEventListener('change',()=>{
        const file=input.files&&input.files[0];
        if(!file) return;
        const image=document.createElement('img');
        image.alt='Photo de profil choisie';
        image.src=URL.createObjectURL(file);
        const badge=document.createElement('span');
        badge.className='photo-add';
        badge.setAttribute('aria-hidden','true');
        badge.textContent='✓';
        button.replaceChildren(image,badge);
        button.setAttribute('aria-label','Changer la photo');
        const copy=button.parentElement.querySelector('small');
        if(copy) copy.textContent='Touchez pour la changer ou la retirer.';
      });
    });
  </script>
